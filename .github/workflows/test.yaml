name: test

on:
  push:
    branches: ['**', '!docs']
    paths:
      - '.github/workflows/test.yaml'
      - 'src/**'
      - 'scripts/build-clock.ts'
      - 'test/**'
      - 'package*.json'
      - 'tsconfig*.json'
      - '.npmrc'
  pull_request:
    branches: [main]
    paths:
      # no way to avoid repeating the paths here
      - '.github/workflows/test.yaml'
      - 'src/**'
      - 'scripts/build-clock.ts'
      - 'test/**'
      - 'package*.json'
      - 'tsconfig*.json'
      - '.npmrc'

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.os }}
          path: test-results/
          retention-days: 2
